<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>잠실청소년센터 AR 포스터</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
a-scene{position:absolute!important;inset:0;z-index:2!important;background:transparent!important}
a-scene .a-canvas{background-color:transparent!important}
/* MindAR의 실제 카메라 video를 배경 레이어에 표시 */
video:not(#movie){z-index:1!important;background:transparent!important;object-fit:cover!important}
.a-canvas{background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
/* MindAR가 생성하는 카메라 영상 위에 AR 캔버스가 투명하게 표시되도록 유지 */
a-scene canvas{background:transparent!important}
#hud{position:fixed;z-index:50;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;text-align:center;background:linear-gradient(#071326c9,transparent);pointer-events:none}
#hud strong{font-size:16px}#status{margin-top:8px;font-size:13px;line-height:1.5}
#controls{position:fixed;z-index:60;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:0;border-radius:25px;background:#fff;color:#15213a;padding:12px 17px;font-size:14px;font-weight:700}
#notice{position:fixed;z-index:70;left:15px;right:15px;top:50%;transform:translateY(-50%);background:#13213beb;border:1px solid #ffffff44;border-radius:16px;padding:20px;text-align:center;display:none}
#notice p{font-size:13px;line-height:1.6}#retry{display:none}
</style></head><body>
<video id="movie" src="./video.mp4" preload="metadata" playsinline webkit-playsinline muted loop style="display:none"></video>
<div id="hud"><strong>잠실청소년센터 공간대관 AR</strong><div id="status" role="status">카메라를 준비하고 있어요...</div></div>
<div id="controls"><button id="sound" type="button">소리 켜기</button><button id="replay" type="button">처음부터 재생</button></div>
<div id="notice"><div id="noticeText">카메라를 실행하지 못했습니다.</div><p>카메라 권한을 허용하고 Chrome 또는 Safari에서 열어주세요.</p><button id="retry" type="button">다시 시도</button></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no" color-space="sRGB" renderer="alpha: true; colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="anchor" mindar-image-target="targetIndex: 0"><a-video src="#movie" width="1" height="1.41534" position="0 0 0.012" material="shader: flat; side: double; transparent: true"></a-video></a-entity>
</a-scene>
<script>
// A-Frame의 WebGL 캔버스는 카메라 영상 위에 투명하게 합성되어야 합니다.
function fixCameraLayer(){
  for(const v of document.querySelectorAll('video')){
    if(v.id==='movie')continue;
    v.style.setProperty('z-index','1','important');
    v.style.setProperty('visibility','visible','important');
    v.style.setProperty('opacity','1','important');
  }
  const canvas=document.querySelector('a-scene canvas');
  if(canvas)canvas.style.setProperty('background','transparent','important');
  if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);}
}
new MutationObserver(fixCameraLayer).observe(document.body,{childList:true,subtree:true});
document.querySelector('a-scene').addEventListener('renderstart',fixCameraLayer);
const scene=document.querySelector('a-scene'),video=document.querySelector('#movie'),anchor=document.querySelector('#anchor');
const status=document.querySelector('#status'),notice=document.querySelector('#notice'),noticeText=document.querySelector('#noticeText'),retry=document.querySelector('#retry'),sound=document.querySelector('#sound'),replay=document.querySelector('#replay');
let starting=false,tracking=false;
function say(t){status.textContent=t}
function fail(e){console.error(e);say('카메라 실행 오류');noticeText.textContent='실행 오류: '+(e?.message||String(e));notice.style.display='block';retry.style.display='inline-block'}
function ready(){if(scene.hasLoaded)return Promise.resolve();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('AR 장면 초기화 시간 초과')),25000);scene.addEventListener('loaded',()=>{clearTimeout(timer);resolve()},{once:true})})}
async function boot(){if(starting)return;starting=true;notice.style.display='none';retry.style.display='none';say('카메라 권한을 허용해주세요.');try{await ready();const ar=scene.systems['mindar-image-system'];if(!ar)throw new Error('AR 엔진을 찾지 못했습니다.');await ar.start();fixCameraLayer();say('포스터 전체를 카메라에 비춰주세요.');}catch(e){fail(e)}finally{starting=false}}
// 별도 시작 버튼 없이 페이지 로드 후 자동으로 카메라 권한을 요청합니다.
window.addEventListener('load',boot,{once:true});retry.addEventListener('click',boot);
anchor.addEventListener('targetFound',async()=>{tracking=true;say('포스터를 인식했어요!');try{await video.play()}catch(e){console.warn(e);say('포스터 인식 완료 · 재생을 눌러주세요.')}});
anchor.addEventListener('targetLost',()=>{tracking=false;video.pause();say('포스터 전체를 카메라에 비춰주세요.')});
replay.addEventListener('click',async()=>{video.currentTime=0;try{await video.play();if(!tracking)say('영상 준비 완료 · 포스터를 비춰주세요.')}catch(e){say('영상 재생 오류: '+e.message)}});
sound.addEventListener('click',async()=>{video.muted=!video.muted;sound.textContent=video.muted?'소리 켜기':'소리 끄기';if(tracking&&video.paused){try{await video.play()}catch(e){console.warn(e)}}});
scene.addEventListener('arError',e=>fail(e.detail||new Error('AR 실행 오류')));
video.addEventListener('error',()=>say('영상 파일을 불러오지 못했습니다.'));
</script></body></html>
